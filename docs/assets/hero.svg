<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Airbnb Analytics</title><desc id="desc">Layered dbt models on Snowflake. An abstract data architecture illustration.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211a1a"/><stop offset="1" stop-color="#120e11"/></linearGradient><radialGradient id="glow"><stop stop-color="#ffb4a5" stop-opacity=".10"/><stop offset="1" stop-color="#ffb4a5" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="420" rx="20" fill="url(#bg)"/><ellipse cx="965" cy="201" rx="315" ry="285" fill="url(#glow)"/><path d="M680 0V420" stroke="#fff" stroke-opacity=".07"/>
<text x="62" y="66" font-family="Arial,sans-serif" font-size="11" letter-spacing="3" fill="#ffb4a5">DBT · SNOWFLAKE</text>
<text x="60" y="139" font-family="Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-2" fill="#f7f2ed">Airbnb Analytics</text>
<text x="62" y="211" font-family="Arial,sans-serif" font-size="29" fill="#f7f2ed">Model the stay.</text><text x="62" y="252" font-family="Arial,sans-serif" font-size="29" fill="#cbbab7">Understand the booking.</text>
<rect x="62" y="326" width="133" height="31" rx="15.5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="128" y="346" text-anchor="middle" fill="#d6ccc8" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.6">BRONZE</text><rect x="207" y="326" width="133" height="31" rx="15.5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="273" y="346" text-anchor="middle" fill="#d6ccc8" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.6">SILVER</text><rect x="352" y="326" width="133" height="31" rx="15.5" fill="#fff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><text x="418" y="346" text-anchor="middle" fill="#d6ccc8" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.6">GOLD</text>
<g fill="none" stroke="#ffb4a5" stroke-width="1.5" stroke-opacity=".45"><rect x="775" y="82" width="338" height="64" rx="10"/><rect x="775" y="174" width="338" height="64" rx="10"/><rect x="775" y="266" width="338" height="64" rx="10"/><path d="M944 146V174M944 238V266" stroke-dasharray="4 5"/></g>
<g font-family="Arial,sans-serif" fill="#e8cfca"><text x="800" y="109" font-size="10" letter-spacing="1.5">01 / SOURCE ENTITIES</text><text x="800" y="130" font-size="13">Listings · Hosts · Bookings</text><text x="800" y="201" font-size="10" letter-spacing="1.5">02 / DBT TRANSFORMATIONS</text><text x="800" y="222" font-size="13">Reusable models and analytical tables</text><text x="800" y="293" font-size="10" letter-spacing="1.5">03 / HISTORY</text><text x="800" y="314" font-size="13">Timestamp-based snapshots</text></g>
<text x="775" y="380" font-family="Arial,sans-serif" font-size="10" letter-spacing="2" fill="#ac9490">SOURCE DATA → MODELS → HISTORY</text>
